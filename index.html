<!DOCTYPE html>
<html lang="en" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECOC 2026 Programme</title>
  <link rel="stylesheet" href="css/style.css">

<!--[if gte mso 9]><xml>
<mso:CustomDocumentProperties>
<mso:_dlc_DocId msdt:dt="string">LNINPATITQSP-1445069751-60829</mso:_dlc_DocId>

</mso:CustomDocumentProperties>
</xml><![endif]-->
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="brand-mark">ECOC</div>
        <div class="brand-text">
          <h1 id="conf-title">Conference Programme</h1>
          <p id="conf-venue" class="muted"></p>
        </div>
      </div>
      <div class="topbar-search">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/></svg>
        <input id="search" type="search" placeholder="Search sessions, talks, speakers, tracks…" autocomplete="off">
      </div>
      <div class="topbar-actions">
        <button id="btn-schedule" class="btn btn-ghost" type="button" title="My schedule">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
          <span>My schedule</span>
          <span id="schedule-count" class="badge hidden">0</span>
        </button>
        <div class="view-toggle" role="group" aria-label="View mode">
          <button id="view-grid" class="btn btn-toggle active" type="button">Grid</button>
          <button id="view-list" class="btn btn-toggle" type="button">List</button>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <nav id="day-tabs" class="day-tabs" aria-label="Conference days"></nav>
      <div class="filters">
        <select id="filter-type" aria-label="Session type">
          <option value="">All types</option>
        </select>
        <select id="filter-track" aria-label="Track">
          <option value="">All tracks</option>
        </select>
        <select id="filter-room" aria-label="Room">
          <option value="">All rooms</option>
        </select>
        <button id="btn-clear" class="btn btn-ghost btn-sm" type="button">Clear filters</button>
      </div>
    </div>

    <div class="workspace" id="workspace">
      <main class="main" id="main">
        <div id="empty" class="empty hidden">No sessions match your search.</div>
        <div id="grid-wrap" class="grid-wrap">
          <div id="grid" class="grid"></div>
        </div>
        <div id="list-wrap" class="list-wrap hidden">
          <div id="list" class="list"></div>
        </div>
      </main>

      <aside id="panel" class="panel" aria-hidden="true">
        <div class="panel-header">
          <button id="panel-close" class="btn btn-icon" type="button" aria-label="Close panel">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </button>
          <div id="panel-meta" class="panel-meta"></div>
        </div>
        <div id="panel-body" class="panel-body"></div>
        <div class="panel-footer">
          <button id="panel-save" class="btn btn-primary" type="button">Add to my schedule</button>
          <button id="panel-export" class="btn btn-ghost" type="button">Export .ics</button>
        </div>
      </aside>
    </div>
  </div>

  <div id="schedule-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="schedule-title">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <header class="modal-header">
        <h2 id="schedule-title">My schedule</h2>
        <button class="btn btn-icon" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </header>
      <div id="schedule-list" class="modal-body"></div>
      <footer class="modal-footer">
        <button id="schedule-export-all" class="btn btn-primary" type="button">Export all to .ics</button>
        <button id="schedule-clear" class="btn btn-ghost" type="button">Clear schedule</button>
      </footer>
    </div>
  </div>

  <script src="data/programme.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
